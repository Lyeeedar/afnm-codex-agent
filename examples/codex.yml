# Install this file as .github/workflows/codex.yml in the target repository.
name: Codex
on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]
permissions:
  contents: read
  issues: read
  pull-requests: read
jobs:
  route:
    if: github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    outputs:
      key: ${{ steps.route.outputs.key }}
    steps:
      - id: route
        uses: actions/github-script@v7
        with:
          script: |
            const e = context.payload;
            const mention = /(^|\s)@codex\b/i;
            const match = (context.eventName === 'issues' && ((e.action === 'labeled' && e.label?.name === 'codex') || (e.action === 'opened' && mention.test(e.issue.body || '')))) ||
              (context.eventName === 'issue_comment' && mention.test(e.comment.body)) ||
              (context.eventName === 'pull_request_review' && (e.review.state === 'changes_requested' || mention.test(e.review.body || ''))) ||
              (context.eventName === 'pull_request_review_comment' && mention.test(e.comment.body));
            if (!match) return;
            const {data:permission} = await github.rest.repos.getCollaboratorPermissionLevel({...context.repo,username:e.sender.login});
            if (!['admin','maintain','write'].includes(permission.permission)) return;
            let pr = e.pull_request;
            if (!pr && e.issue?.pull_request) {
              ({data:pr} = await github.rest.pulls.get({...context.repo,pull_number:e.issue.number}));
            }
            core.setOutput('key', pr ? pr.head.ref : `codex/issue-${e.issue.number}`);
  agent:
    needs: route
    if: needs.route.outputs.key != ''
    # Replace with your existing Ubicloud Linux x64 label.
    runs-on: ubicloud-standard-2
    timeout-minutes: 150
    concurrency:
      group: codex-${{ github.repository }}-${{ needs.route.outputs.key }}
      cancel-in-progress: false
    steps:
      - uses: Lyeeedar/afnm-codex-agent@main # Pin a commit SHA after installation.
        with:
          github-app-id: ${{ vars.CODEX_APP_ID }}
          github-app-private-key: ${{ secrets.CODEX_APP_PRIVATE_KEY }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          openai-executor-api-key: ${{ secrets.OPENAI_EXECUTOR_API_KEY }}
          model: gpt-6-luna
          reasoning-effort: medium
          # executor-image: ghcr.io/YOUR-ORG/codex-executor:PINNED-VERSION
